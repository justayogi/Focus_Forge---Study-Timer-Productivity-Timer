<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusForge | Study Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>FocusForge</h1>
      <button id="themeToggle" class="ghost-btn" aria-label="Toggle dark mode">Dark mode</button>
    </header>

    <section class="card timer-card">
      <p id="modeLabel" class="mode-label">Focus Session</p>
      <h2 id="timeDisplay" class="time-display">25:00</h2>

      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressBar" class="progress-fill"></div>
      </div>

      <div class="actions">
        <button id="startBtn" class="primary-btn">Start</button>
        <button id="pauseBtn" class="secondary-btn">Pause</button>
        <button id="resetBtn" class="secondary-btn">Reset</button>
      </div>
    </section>

    <section class="card stats-card">
      <h3>Today&apos;s Progress</h3>
      <p class="sessions-text">Sessions completed today: <span id="sessionCount">0</span></p>
      <p class="hint">Keep going. One focused block at a time.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
