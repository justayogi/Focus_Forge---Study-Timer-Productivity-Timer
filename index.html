<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusForge - Study Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to FocusForge</h1>
        <p>Your productivity timer for better studying.</p>

        <section>
            <h2>Timer Display</h2>
            <div id="timer">00:00:00</div>
        </section>
    </main>

    <script src="script.js"></script>
